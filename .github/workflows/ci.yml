name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, Airflow 3.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - uses: astral-sh/setup-uv@v7
        with:
          # Without a suffix every job computes the same cache key, so all but
          # one fail to save it.
          cache-suffix: py${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # Dependencies are pinned in ci/requirements-ci-<python>.txt.
        run: |
          uv pip install -r "ci/requirements-ci-${{ matrix.python-version }}.txt"
          uv pip install --no-deps -e .

      - name: Lint
        run: |
          black --check .
          flake8 .

      - name: Test
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest -v

  core-without-airflow:
    name: Core without Airflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: core

      - name: Install the core only
        run: |
          uv venv --python 3.11 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e . pytest

      - name: Check that Airflow is not installed
        run: |
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('airflow') is not None)"

      - name: Test
        run: pytest -v

  # Keep this job's name stable: the main branch ruleset requires it as a status
  # check. It passes only when every job above passed.
  lint-and-test:
    name: Lint and test
    if: always()
    needs: [test, core-without-airflow]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.core-without-airflow.result }}" = "success"
