[metadata]
name = debussy
version = attr: debussy.__version__
description = Opinionated data architecture and engineering framework for building data pipelines
author = Lawrence Fernandes
author_email = github@lawrencestfs.com
url = https://github.com/debussy-labs/debussy
long_description = file: README.md, CHANGELOG.md
long_description_content_type = text/markdown
keywords =
    Debussy Framework
    debussy
license = Apache-2.0
license_file = LICENSE
platforms = any
classifiers =
    Operating System :: OS Independent
    License :: OSI Approved :: Apache Software License
    Topic :: Utilities
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Framework :: Apache Airflow

[options]
python_requires = >=3.11
install_requires = file: requirements.txt
packages = find_namespace:

[options.packages.find]
include =
    debussy*

[options.extras_require]
# Airflow backend (debussy.backends.airflow).
airflow =
    apache-airflow>=3.4,<4
    apache-airflow-providers-common-sql
    apache-airflow-providers-standard
# Google Cloud: BigQuery, Dataproc and Cloud Storage motifs.
gcp =
    debussy[airflow]
    apache-airflow-providers-google
# dbt transformation pipelines.
dbt =
    dbt-bigquery
# Reverse ETL to MySQL.
mysql =
    mysqlclient
    pandas
# Reverse ETL to SFTP.
sftp =
    paramiko

[flake8]
# CI only checks for errors that break at runtime (syntax errors, undefined names).
select = E9,F63,F7,F82
exclude = .git,__pycache__,.venv,build,dist
